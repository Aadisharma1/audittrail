services:
  api:
    build: .
    command: ["python", "scripts/serve.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8300:8000"
    environment:
      - AUDITTRAIL_DB=/app/data/audit.db
      - AUDITTRAIL_JWT_SECRET=change-me-in-production
    volumes:
      - audit-data:/app/data

  web:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev"
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8300
    volumes:
      - ./frontend:/web
    depends_on:
      - api

volumes:
  audit-data:
